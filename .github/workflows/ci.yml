name: CI

on:
  pull_request:
    branches: [testnet-implementation, main]
  push:
    branches: [testnet-implementation, main]

jobs:
  tracked-build-artifacts:
    name: No gitignored files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a gitignored path is tracked
        run: |
          tracked_ignored="$(git ls-files -i -c --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "The following gitignored files are tracked in git:"
            echo "$tracked_ignored"
            exit 1
          fi

  contracts:
    name: Contracts (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  frontend:
    name: Frontend (lint, type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
